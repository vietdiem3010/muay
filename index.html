<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HLV Muay Thái - Chuẩn Tiếng Việt</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      text-align: center;
      padding: 12px;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 95vh;
      user-select: none;
    }
    .status-badge {
      display: inline-block;
      padding: 5px 14px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 0.85rem;
      margin: 0 auto 6px auto;
      text-transform: uppercase;
      background: rgba(0, 230, 118, 0.2);
      color: #00e676;
      border: 1px solid #00e676;
    }
    .timer {
      font-size: 4.2rem;
      font-weight: 900;
      margin: 0;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
      line-height: 1.05;
    }
    .combo-box {
      background: #1e1e1e;
      border: 3px solid #ff3b30;
      border-radius: 16px;
      padding: 16px 12px;
      margin: 10px 0;
      min-height: 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 1.65rem;
      font-weight: 800;
      color: #ffd60a;
      box-shadow: 0 6px 20px rgba(255,59,48,0.2);
    }
    .counter-tag {
      font-size: 0.8rem;
      color: #999;
      margin-top: 6px;
      font-weight: normal;
    }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 440px;
      margin: 0 auto;
      width: 100%;
    }
    select, button {
      padding: 12px;
      font-size: 0.98rem;
      border-radius: 10px;
      border: none;
      font-weight: bold;
    }
    select { background: #2c2c2e; color: #fff; text-align: center; }
    .btn-row { display: flex; gap: 8px; }
    button { flex: 1; cursor: pointer; }
    .btn-start { background: #ff3b30; color: white; font-size: 1.1rem; }
    .btn-test { background: #0a84ff; color: white; flex: 0.5; }
    .btn-stop { background: #3a3a3c; color: white; }
    .slider-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .slider-box {
      background: #1e1e1e;
      padding: 8px 12px;
      border-radius: 10px;
      text-align: left;
      font-size: 0.82rem;
      color: #ddd;
    }
  </style>
</head>
<body>

  <div id="statusBadge" class="status-badge">MỞ BẰNG APP EDGE ĐỂ NGHE GIỌNG CHUẨN NHẤT</div>
  <h1 id="roundTitle" style="font-size:1.2rem; margin:0 0 4px 0;">HLV MUAY THÁI (SOUTHPAW)</h1>

  <div class="timer" id="timer">03:00</div>

  <div class="combo-box" id="comboBox">
    <div id="comboDisplay">Bấm "THỬ GIỌNG" để kiểm tra!</div>
    <div class="counter-tag" id="comboCount">Phát âm chuẩn xác - Không ngọng chữ</div>
  </div>

  <div class="controls">
    <select id="modeSelect">
      <option value="auto" selected>🔥 Tự động chạy Hiệp 1 ➔ Hiệp 4</option>
      <option value="1">Hiệp 1: Phản xạ & Bộ pháp</option>
      <option value="2">Hiệp 2: Tổ hợp Đấm + Đá</option>
      <option value="3">Hiệp 3: Chỏ, Gối & Phản công</option>
    </select>

    <select id="voiceSelect">
      <option value="">Đang tải giọng đọc chuẩn...</option>
    </select>

    <div class="slider-grid">
      <div class="slider-box">
        <label>Tốc độ: <strong id="rateVal" style="color:#ffd60a;">1.20</strong>x</label>
        <input type="range" id="rateRange" min="0.9" max="1.5" step="0.05" value="1.20" style="width:100%; margin-top:5px;">
      </div>
      <div class="slider-box">
        <label>Nghỉ giữa lệnh: <strong id="pauseVal" style="color:#00e676;">2.5</strong>s</label>
        <input type="range" id="pauseRange" min="1.0" max="4.5" step="0.5" value="2.5" style="width:100%; margin-top:5px;">
      </div>
    </div>

    <div class="btn-row">
      <button class="btn-test" onclick="testVoice()">THỬ GIỌNG</button>
      <button class="btn-start" id="startBtn" onclick="startSession()">BẮT ĐẦU</button>
      <button class="btn-stop" onclick="stopSession()">DỪNG</button>
    </div>
  </div>

  <script>
    const roundNames = {
      1: "Hiệp 1: Phản xạ & Bộ pháp",
      2: "Hiệp 2: Tổ hợp Đấm + Đá",
      3: "Hiệp 3: Chỏ, Gối & Phản công",
      4: "Hiệp 4: Thực chiến tổng hợp"
    };

    // Khẩu lệnh đã tối ưu hóa văn bản để đọc cực kỳ rõ chữ
    const combos = {
      1: [
        { text: "Một!", hits: 1 },
        { text: "Một, Một!", hits: 2 },
        { text: "Một Hai!", hits: 2 },
        { text: "Đạp phải!", hits: 1 },
        { text: "Đạp trái!", hits: 1 },
        { text: "Nhấc chân đỡ!", hits: 1 },
        { text: "Một Hai Ba!", hits: 3 },
        { text: "Hai Ba Hai!", hits: 3 },
        { text: "Lùi bước, Một Hai!", hits: 2 },
        { text: "Một, đấm thẳng vào vùng bụng!", hits: 2 },
        { text: "Lách đầu, Hai Ba!", hits: 2 }
      ],
      2: [
        { text: "Một Hai, Đá trái!", hits: 3 },
        { text: "Một Hai, Hai cái đá trái!", hits: 4 },
        { text: "Một Hai Ba, Phá đùi trái!", hits: 4 },
        { text: "Hai Ba, Đá sườn trái!", hits: 3 },
        { text: "Một, Phá đùi phải!", hits: 2 },
        { text: "Một Hai, Đổi chân đá phải!", hits: 3 },
        { text: "Đạp phải! Bước tới Hai, Đá trái!", hits: 3 },
        { text: "Nhá đạp! Hai Ba, Đá trái!", hits: 3 },
        { text: "Một Sáu Ba, Phá đùi trái!", hits: 4 }
      ],
      3: [
        { text: "Một Hai, Chỏ phải!", hits: 3 },
        { text: "Một Hai, Chỏ phải, Gối trái!", hits: 4 },
        { text: "Một Sáu Ba, Gối trái!", hits: 4 },
        { text: "Đạp phải! Bước vào Hai, Chỏ phải!", hits: 3 },
        { text: "Ôm gáy, Hai cái gối trái!", hits: 2 },
        { text: "Đỡ chân! Hai Ba, Đá trái!", hits: 3 },
        { text: "Đỡ chân! Hai, Chỏ phải, Gối trái!", hits: 3 }
      ]
    };
    combos[4] = [...combos[1], ...combos[2], ...combos[3]];

    const WORK_TIME = 180;
    const REST_TIME = 60;
    const PREP_TIME = 10;

    let currentRound = 1;
    let isAutoMode = true;
    let phase = "IDLE";
    let timeLeft = WORK_TIME;
    let deck = [];
    let countDone = 0;

    let timerInterval = null;
    let comboTimeout = null;
    let isRunning = false;
    let audioCtx = null;

    document.getElementById('rateRange').oninput = (e) => document.getElementById('rateVal').textContent = e.target.value;
    document.getElementById('pauseRange').oninput = (e) => document.getElementById('pauseVal').textContent = e.target.value;

    function loadVoices() {
      if (!('speechSynthesis' in window)) return;
      const voices = window.speechSynthesis.getVoices();
      const select = document.getElementById('voiceSelect');
      const viVoices = voices.filter(v => v.lang.includes('vi') || v.lang.includes('VN'));
      select.innerHTML = '';
      (viVoices.length ? viVoices : voices.slice(0, 5)).forEach((v) => {
        const opt = document.createElement('option');
        opt.value = v.name;
        opt.textContent = v.name;
        if (v.name.includes('NamMinh') || v.name.includes('Natural') || v.name.includes('Linh')) opt.selected = true;
        select.appendChild(opt);
      });
    }
    if ('speechSynthesis' in window) {
      loadVoices();
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playPadHits(count, callback) {
      initAudio();
      const interval = 310;
      for (let i = 0; i < count; i++) {
        setTimeout(() => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          const isHeavy = (i === count - 1 && count >= 3);
          osc.frequency.setValueAtTime(isHeavy ? 130 : 185, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(35, audioCtx.currentTime + 0.12);
          gain.gain.setValueAtTime(isHeavy ? 0.95 : 0.7, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.12);
        }, 220 + i * interval);
      }
      setTimeout(() => { if (callback) callback(); }, 220 + count * interval);
    }

    function speak(text, callback) {
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'vi-VN';
      utter.pitch = 0.95; // Giữ độ cao tự nhiên để không bị ngọng
      utter.rate = parseFloat(document.getElementById('rateRange').value);

      const selectedVoiceName = document.getElementById('voiceSelect').value;
      const voices = window.speechSynthesis.getVoices();
      const chosen = voices.find(v => v.name === selectedVoiceName) || voices.find(v => v.lang.includes('vi'));
      if (chosen) utter.voice = chosen;

      utter.onend = () => { if (callback) callback(); };
      utter.onerror = () => { if (callback) callback(); };
      window.speechSynthesis.speak(utter);
    }

    function testVoice() {
      initAudio();
      const sample = { text: "Một, đấm thẳng vào vùng bụng!", hits: 2 };
      document.getElementById('comboDisplay').textContent = sample.text;
      speak(sample.text, () => playPadHits(sample.hits));
    }

    function shuffleDeck(roundNum) {
      deck = [...combos[roundNum]];
      for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
      }
    }

    function startSession() {
      if (isRunning) return;
      initAudio();
      isRunning = true;
      currentRound = 1;
      timeLeft = WORK_TIME;
      document.getElementById('startBtn').textContent = "ĐANG TẬP...";
      nextLoop();
      timerInterval = setInterval(() => {
        timeLeft--;
        const m = String(Math.floor(timeLeft / 60)).padStart(2, '0');
        const s = String(timeLeft % 60).padStart(2, '0');
        document.getElementById('timer').textContent = `${m}:${s}`;
        if (timeLeft <= 0) stopSession();
      }, 1000);
    }

    function nextLoop() {
      if (!isRunning) return;
      const mode = document.getElementById('modeSelect').value;
      const list = mode === 'auto' ? combos[currentRound] : combos[parseInt(mode)];
      const item = list[Math.floor(Math.random() * list.length)];
      document.getElementById('comboDisplay').textContent = item.text;
      speak(item.text, () => {
        if (!isRunning) return;
        playPadHits(item.hits, () => {
          const pauseMs = parseFloat(document.getElementById('pauseRange').value) * 1000;
          comboTimeout = setTimeout(nextLoop, pauseMs);
        });
      });
    }

    function stopSession() {
      isRunning = false;
      clearInterval(timerInterval);
      clearTimeout(comboTimeout);
      window.speechSynthesis.cancel();
      document.getElementById('startBtn').textContent = "BẮT ĐẦU";
      document.getElementById('comboDisplay').textContent = "Đã dừng!";
    }
  </script>
</body>
</html>
