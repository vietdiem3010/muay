<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HLV Muay Thái Auto 4 Hiệp - Thuận Tay Trái</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      text-align: center;
      padding: 15px;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 94vh;
      user-select: none;
    }
    .status-badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      margin: 0 auto 8px auto;
      text-transform: uppercase;
      background: #2c2c2e;
      color: #aaa;
    }
    .status-work { background: rgba(255, 59, 48, 0.2); color: #ff453a; border: 1px solid #ff453a; }
    .status-rest { background: rgba(0, 230, 118, 0.2); color: #00e676; border: 1px solid #00e676; }
    .status-prep { background: rgba(255, 214, 10, 0.2); color: #ffd60a; border: 1px solid #ffd60a; }

    h1 { color: #ffffff; font-size: 1.35rem; margin: 0 0 4px 0; }
    .timer {
      font-size: 4.8rem;
      font-weight: 900;
      margin: 2px 0;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
      line-height: 1.05;
    }
    .combo-box {
      background: #1e1e1e;
      border: 3px solid #ff3b30;
      border-radius: 16px;
      padding: 20px 15px;
      margin: 12px 0;
      min-height: 115px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 1.65rem;
      font-weight: bold;
      color: #ffd60a;
      box-shadow: 0 6px 20px rgba(255,59,48,0.2);
      transition: border-color 0.3s;
    }
    .combo-box.rest-mode {
      border-color: #00e676;
      color: #00e676;
      box-shadow: 0 6px 20px rgba(0,230,118,0.15);
    }
    .counter-tag {
      font-size: 0.82rem;
      color: #999;
      margin-top: 8px;
      font-weight: normal;
    }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 440px;
      margin: 0 auto;
      width: 100%;
    }
    select, button, input[type="range"] {
      padding: 14px;
      font-size: 1.02rem;
      border-radius: 12px;
      border: none;
      font-weight: bold;
    }
    select { background: #2c2c2e; color: #fff; text-align: center; }
    .btn-row { display: flex; gap: 10px; }
    button { flex: 1; cursor: pointer; transition: 0.15s; }
    .btn-start { background: #ff3b30; color: white; font-size: 1.15rem; }
    .btn-start:active { transform: scale(0.97); }
    .btn-stop { background: #3a3a3c; color: white; }
    .slider-box {
      background: #1e1e1e;
      padding: 10px 15px;
      border-radius: 12px;
      text-align: left;
      font-size: 0.9rem;
      color: #ddd;
    }
    .round-dots {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 6px 0;
    }
    .dot {
      width: 42px;
      height: 8px;
      border-radius: 4px;
      background: #333;
      transition: 0.3s;
    }
    .dot.active { background: #ff3b30; box-shadow: 0 0 8px #ff3b30; }
    .dot.done { background: #00e676; }
    .legend {
      margin-top: 12px;
      font-size: 0.78rem;
      color: #777;
      line-height: 1.45;
    }
  </style>
</head>
<body>

  <div id="statusBadge" class="status-badge">SẴN SÀNG TẬP LUYỆN</div>
  <h1 id="roundTitle">CHẾ ĐỘ TỰ ĐỘNG 4 HIỆP (RẢNH TAY)</h1>

  <div class="round-dots">
    <div class="dot" id="dot1"></div>
    <div class="dot" id="dot2"></div>
    <div class="dot" id="dot3"></div>
    <div class="dot" id="dot4"></div>
  </div>

  <div class="timer" id="timer">03:00</div>

  <div class="combo-box" id="comboBox">
    <div id="comboDisplay">Bấm "BẮT ĐẦU" rồi xỏ găng!</div>
    <div class="counter-tag" id="comboCount">Có 10 giây chuẩn bị trước khi vào Hiệp 1</div>
  </div>

  <div class="controls">
    <select id="modeSelect">
      <option value="auto" selected>🔥 Tự động chạy liên tục Hiệp 1 ➔ Hiệp 4</option>
      <option value="1">Chỉ tập riêng Hiệp 1 (Cơ bản & Bộ pháp)</option>
      <option value="2">Chỉ tập riêng Hiệp 2 (Tổ hợp Đấm + Đá)</option>
      <option value="3">Chỉ tập riêng Hiệp 3 (Chỏ, Gối & Phòng thủ)</option>
      <option value="4">Chỉ tập riêng Hiệp 4 (Tổng hợp 50+ bài)</option>
    </select>

    <div class="slider-box">
      <label for="pauseRange">Nghỉ giữa 2 lệnh: <strong id="pauseVal" style="color:#00e676;">3.0</strong> giây</label>
      <input type="range" id="pauseRange" min="1.5" max="6" step="0.5" value="3.0" style="width:100%; margin-top:6px; padding:0;">
    </div>

    <div class="btn-row">
      <button class="btn-start" id="startBtn" onclick="startSession()">BẮT ĐẦU BUỔI TẬP</button>
      <button class="btn-stop" onclick="stopSession()">DỪNG / ĐẶT LẠI</button>
    </div>
  </div>

  <div class="legend">
    <strong>Quy ước (Thuận tay trái - Chân phải trước):</strong><br>
    1: Thẳng phải | 2: Thẳng trái | 3: Móc ngang phải<br>
    4: Móc ngang trái | 5: Móc dưới phải | 6: Móc dưới trái
  </div>

  <script>
    const roundNames = {
      1: "Hiệp 1: Phản xạ, Đòn lẻ & Bộ pháp",
      2: "Hiệp 2: Tổ hợp Đấm + Đá biến hóa",
      3: "Hiệp 3: Chỏ, Gối & Phòng thủ phản công",
      4: "Hiệp 4: Thực chiến tổng hợp toàn diện"
    };

    const combos = {
      1: [
        "Một!",
        "Một, Một!",
        "Một, Hai!",
        "Một, một, Hai!",
        "Đạp chân phải!",
        "Đạp chân trái!",
        "Nhấc chân phải đỡ đòn!",
        "Nhấc chân trái đỡ đòn!",
        "Một, Hai, Ba!",
        "Hai, Ba, Hai!",
        "Bước sang phải, đấm Hai!",
        "Lùi một bước, Một, Hai!",
        "Một, cúi đấm Hai vào bụng!",
        "Hai vào bụng, Ba lên mặt!",
        "Nhá đạp phải, bước tới Một, Hai!",
        "Lách đầu sang phải, đấm Hai!"
      ],
      2: [
        "Một, Hai, Đá chân trái!",
        "Một, Hai, Đá chân trái hai cái liên tiếp!",
        "Một, Hai, Ba, Đá thấp chân trái!",
        "Hai, Ba, Đá giữa chân trái!",
        "Một, Đá thấp chân phải!",
        "Đá thấp chân phải, đấm Hai, Ba!",
        "Một, Hai, Nhảy đổi chân, Đá phải!",
        "Hai, Ba, Nhảy đổi chân, Đá phải!",
        "Một, Ba, Đá chân trái!",
        "Một, Hai, Bốn, Đá thấp chân phải!",
        "Đạp chân phải, bước tới Hai, Đá trái!",
        "Nhá đạp phải, đấm Hai, Ba, Đá trái!",
        "Một, Hai, Đá cao chân trái lên đầu!",
        "Ba, Hai, Đá chân trái!",
        "Một, Sáu, Ba, Đá thấp chân trái!",
        "Năm, Hai, Ba, Đá chân trái!",
        "Đạp phải, Nhảy đổi chân, Đá phải!",
        "Một, Hai, Ba, Hai, Đá chân trái!"
      ],
      3: [
        "Một, Hai, Chỏ phải!",
        "Một, Hai, Chỏ phải, Chỏ trái!",
        "Một, Hai, Chỏ phải, Gối trái!",
        "Một, Sáu, Ba, Gối trái!",
        "Hai, Ba, Gối trái!",
        "Một, Hai, Nhảy đổi chân, Gối phải!",
        "Đạp phải, bước tới Hai, Chỏ phải!",
        "Ôm gáy, thúc Gối trái hai cái!",
        "Nhấc chân phải đỡ, Hai, Ba, Đá trái!",
        "Nhấc chân phải đỡ, Hai, Chỏ phải, Gối trái!",
        "Lùi một bước né, bật tới Hai, Ba, Gối trái!",
        "Lách đầu sang phải, Hai, Ba, Đá trái!",
        "Một, Bốn, Chỏ phải, Gối trái!",
        "Năm, Sáu, Ba, Gối trái!",
        "Chỏ phải, Chỏ trái, ôm gáy Gối trái!",
        "Nhấc chân trái đỡ, Ba, Hai, Đá trái!"
      ]
    };
    combos[4] = [...combos[1], ...combos[2], ...combos[3]];

    const WORK_TIME = 180; // 3 phút tập
    const REST_TIME = 60;  // 1 phút nghỉ
    const PREP_TIME = 10;  // 10 giây chuẩn bị đeo găng

    let currentRound = 1;
    let totalRounds = 4;
    let isAutoMode = true;
    let phase = "IDLE"; // IDLE, PREP, WORK, REST
    let timeLeft = WORK_TIME;
    let deck = [];
    let countDone = 0;

    let timerInterval = null;
    let comboTimeout = null;
    let isRunning = false;
    let audioCtx = null;
    let wakeLock = null;

    const pauseRange = document.getElementById('pauseRange');
    const pauseVal = document.getElementById('pauseVal');
    pauseRange.addEventListener('input', (e) => {
      pauseVal.textContent = e.target.value;
    });

    // Giữ màn hình điện thoại luôn sáng
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (e) {}
    }

    function releaseWakeLock() {
      if (wakeLock !== null) {
        wakeLock.release().then(() => { wakeLock = null; });
      }
    }

    function updateDots() {
      for (let i = 1; i <= 4; i++) {
        const dot = document.getElementById('dot' + i);
        dot.className = 'dot';
        if (i < currentRound) dot.classList.add('done');
        else if (i === currentRound && phase !== "IDLE") dot.classList.add('active');
      }
    }

    function shuffleDeck(roundNum) {
      deck = [...combos[roundNum]];
      for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
      }
    }

    function playBell(times = 1) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        for (let i = 0; i < times; i++) {
          setTimeout(() => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.65, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.75);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.75);
          }, i * 350);
        }
      } catch (e) {}
    }

    function speak(text, callback) {
      if (!('speechSynthesis' in window)) {
        if (callback) callback();
        return;
      }
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'vi-VN';
      utter.rate = 1.12;

      const voices = window.speechSynthesis.getVoices();
      const viVoice = voices.find(v => v.lang.includes('vi') || v.lang.includes('VN'));
      if (viVoice) utter.voice = viVoice;

      utter.onend = () => { if (callback && isRunning) callback(); };
      utter.onerror = () => { if (callback && isRunning) callback(); };
      window.speechSynthesis.speak(utter);
    }

    function updateTimerDisplay() {
      const m = String(Math.floor(timeLeft / 60)).padStart(2, '0');
      const s = String(timeLeft % 60).padStart(2, '0');
      document.getElementById('timer').textContent = `${m}:${s}`;
    }

    function setUIState(badgeText, badgeClass, titleText, boxRestMode) {
      const badge = document.getElementById('statusBadge');
      badge.textContent = badgeText;
      badge.className = 'status-badge ' + badgeClass;
      document.getElementById('roundTitle').textContent = titleText;
      const box = document.getElementById('comboBox');
      if (boxRestMode) box.classList.add('rest-mode');
      else box.classList.remove('rest-mode');
      updateDots();
    }

    // Bắt đầu toàn bộ buổi tập (Bắt đầu bằng 10s chuẩn bị)
    function startSession() {
      if (isRunning) return;
      isRunning = true;
      requestWakeLock();

      const mode = document.getElementById('modeSelect').value;
      if (mode === 'auto') {
        isAutoMode = true;
        currentRound = 1;
      } else {
        isAutoMode = false;
        currentRound = parseInt(mode);
      }

      document.getElementById('startBtn').textContent = "ĐANG CHẠY TỰ ĐỘNG...";
      startPrepPhase();

      timerInterval = setInterval(tick, 1000);
    }

    function startPrepPhase() {
      phase = "PREP";
      timeLeft = PREP_TIME;
      updateTimerDisplay();
      setUIState("CHUẨN BỊ XỎ GĂNG", "status-prep", roundNames[currentRound], true);
      document.getElementById('comboDisplay').textContent = "10 giây chuẩn bị! Xỏ găng vào!";
      document.getElementById('comboCount').textContent = "Tư thế: Chân phải trước - Chân trái sau";
      speak(`Chuẩn bị vào hiệp ${currentRound}. Bạn có mười giây để xỏ găng!`);
    }

    function startWorkPhase() {
      phase = "WORK";
      timeLeft = WORK_TIME;
      countDone = 0;
      shuffleDeck(currentRound);
      updateTimerDisplay();
      playBell(1);

      setUIState(`ĐANG TẬP HIỆP ${currentRound} / 4`, "status-work", roundNames[currentRound], false);
      document.getElementById('comboDisplay').textContent = "Thủ cao tay! Nhún nhảy!";
      document.getElementById('comboCount').textContent = `Đã trộn ${deck.length} combo cho hiệp này`;

      speak(`Hiệp ${currentRound}, bắt đầu! Thủ cao hai tay lên!`, () => {
        comboTimeout = setTimeout(nextCombo, 1000);
      });
    }

    function startRestPhase() {
      phase = "REST";
      timeLeft = REST_TIME;
      clearTimeout(comboTimeout);
      updateTimerDisplay();
      playBell(2);

      const nextRound = currentRound + 1;
      setUIState(`NGHỈ GIẢI LAO (1 PHÚT)`, "status-rest", `Chuẩn bị sang Hiệp ${nextRound}`, true);
      document.getElementById('comboDisplay').textContent = "Thả lỏng vai, đi lại và hít thở sâu!";
      document.getElementById('comboCount').textContent = `Tiếp theo: ${roundNames[nextRound]}`;

      speak(`Hết hiệp ${currentRound}! Quá tốt! Nghỉ một phút, thả lỏng vai và hít thở sâu!`);
    }

    function tick() {
      if (!isRunning) return;
      timeLeft--;
      updateTimerDisplay();

      // Đếm ngược 3 giây cuối trước khi vào hiệp
      if ((phase === "PREP" || phase === "REST") && timeLeft === 10 && phase === "REST") {
        document.getElementById('comboDisplay').textContent = "Còn 10 giây! Thủ thế chuẩn bị!";
        speak(`Còn mười giây! Chuẩn bị vào hiệp ${currentRound + 1}!`);
      }

      if (timeLeft <= 0) {
        if (phase === "PREP") {
          startWorkPhase();
        } else if (phase === "WORK") {
          if (isAutoMode && currentRound < totalRounds) {
            startRestPhase();
          } else {
            finishAllSession();
          }
        } else if (phase === "REST") {
          currentRound++;
          startWorkPhase();
        }
      }
    }

    function nextCombo() {
      if (!isRunning || phase !== "WORK") return;

      if (timeLeft <= 28 && timeLeft >= 23 && !deck.warned30s) {
        deck.warned30s = true;
        document.getElementById('comboDisplay').textContent = "30 GIÂY CUỐI! BUNG HẾT SỨC!";
        speak("Ba mươi giây cuối! Đánh nhanh và mạnh hơn!", () => {
          comboTimeout = setTimeout(triggerNextFromDeck, 700);
        });
        return;
      }

      triggerNextFromDeck();
    }

    function triggerNextFromDeck() {
      if (!isRunning || phase !== "WORK") return;
      if (deck.length === 0) shuffleDeck(currentRound);

      const currentCombo = deck.pop();
      countDone++;

      document.getElementById('comboDisplay').textContent = currentCombo;
      document.getElementById('comboCount').textContent = `Hiệp ${currentRound} • Lệnh số ${countDone}`;

      speak(currentCombo, () => {
        if (!isRunning || phase !== "WORK") return;
        const pauseMs = parseFloat(pauseRange.value) * 1000;
        comboTimeout = setTimeout(nextCombo, pauseMs);
      });
    }

    function stopSession() {
      isRunning = false;
      phase = "IDLE";
      clearInterval(timerInterval);
      clearTimeout(comboTimeout);
      releaseWakeLock();
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      timeLeft = WORK_TIME;
      updateTimerDisplay();
      setUIState("ĐÃ DỪNG", "", "CHẾ ĐỘ TỰ ĐỘNG 4 HIỆP (RẢNH TAY)", false);
      document.getElementById('startBtn').textContent = "BẮT ĐẦU BUỔI TẬP";
      document.getElementById('comboDisplay').textContent = "Đã đặt lại. Bấm BẮT ĐẦU để tập!";
      document.getElementById('comboCount').textContent = "Có 10 giây chuẩn bị trước khi vào Hiệp 1";
    }

    function finishAllSession() {
      isRunning = false;
      phase = "IDLE";
      clearInterval(timerInterval);
      clearTimeout(comboTimeout);
      releaseWakeLock();
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      playBell(3);

      for (let i = 1; i <= 4; i++) {
        document.getElementById('dot' + i).className = 'dot done';
      }

      setUIState("HOÀN THÀNH XUẤT SẮC", "status-rest", "ĐÃ XONG TOÀN BỘ 4 HIỆP!", true);
      document.getElementById('startBtn').textContent = "TẬP LẠI TỪ ĐẦU";
      document.getElementById('comboDisplay').textContent = "TUYỆT VỜI! BẠN ĐÃ HOÀN THÀNH BUỔI TẬP!";
      document.getElementById('comboCount').textContent = "Nhớ giãn cơ chân và hông 5 phút nhé!";
      speak("Hết giờ! Chúc mừng bạn đã hoàn thành xuất sắc bốn hiệp tập! Hãy tháo găng, uống nước và giãn cơ nhé!");
      timeLeft = WORK_TIME;
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }
  </script>
</body>
</html>
