<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HLV Muay Thái AI Studio (ElevenLabs & OpenAI)</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      text-align: center;
      padding: 12px;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 95vh;
      user-select: none;
    }
    .status-badge {
      display: inline-block;
      padding: 5px 14px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 0.82rem;
      margin: 0 auto 4px auto;
      text-transform: uppercase;
      background: #2c2c2e;
      color: #00e676;
      border: 1px solid #00e676;
    }
    .timer {
      font-size: 4rem;
      font-weight: 900;
      margin: 0;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
      line-height: 1.05;
    }
    .combo-box {
      background: #1e1e1e;
      border: 3px solid #ff3b30;
      border-radius: 16px;
      padding: 16px 12px;
      margin: 8px 0;
      min-height: 95px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 1.55rem;
      font-weight: 800;
      color: #ffd60a;
      box-shadow: 0 6px 20px rgba(255,59,48,0.2);
    }
    .counter-tag { font-size: 0.78rem; color: #aaa; margin-top: 6px; font-weight: normal; }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 450px;
      margin: 0 auto;
      width: 100%;
    }
    select, button, input[type="password"] {
      padding: 11px;
      font-size: 0.95rem;
      border-radius: 10px;
      border: none;
      font-weight: bold;
    }
    select, input[type="password"] { background: #2c2c2e; color: #fff; text-align: center; }
    .btn-row { display: flex; gap: 8px; }
    button { flex: 1; cursor: pointer; }
    .btn-start { background: #ff3b30; color: white; font-size: 1.05rem; }
    .btn-test { background: #0a84ff; color: white; flex: 0.55; }
    .btn-stop { background: #3a3a3c; color: white; flex: 0.45; }
    .panel {
      background: #1c1c1e;
      border: 1px solid #333;
      padding: 10px;
      border-radius: 10px;
      text-align: center;
      font-size: 0.82rem;
    }
  </style>
</head>
<body>

  <div id="statusBadge" class="status-badge">HLV MUAY THÁI - AI STUDIO</div>
  <div class="timer" id="timer">03:00</div>

  <div class="combo-box" id="comboBox">
    <div id="comboDisplay">Dán API Key bên dưới rồi bấm "THỬ GIỌNG"</div>
    <div class="counter-tag" id="comboCount">Tư thế: Chân phải trước - Chân trái sau</div>
  </div>

  <div class="controls">
    <select id="engineSelect" onchange="switchEngine()">
      <option value="elevenlabs" selected>🔥 1. Giọng ElevenLabs AI (Miễn phí 10.000 từ/tháng)</option>
      <option value="openai">2. Giọng OpenAI Studio (Giọng Onyx Nam Trầm)</option>
      <option value="browser">3. Giọng Trình Duyệt (Không cần API Key)</option>
    </select>

    <!-- Ô nhập API Key cho ElevenLabs / OpenAI -->
    <div id="apiPanel" class="panel">
      <input type="password" id="apiKeyInput" placeholder="Dán mã API Key vào đây..." style="width:93%; margin-bottom:8px;" onchange="saveKey()">
      
      <select id="elevenVoiceSelect" style="width:100%;">
        <option value="pNInz6obpgDQGcFmaJgB">Giọng Adam (Nam trầm, mạnh mẽ - Chuẩn HLV)</option>
        <option value="ErXwobaYiN019PkySvjV">Giọng Antoni (Nam dứt khoát, năng lượng cao)</option>
        <option value="VR6AewLTigWG4xSOukaG">Giọng Arnold (Nam gằn giọng, cực gắt)</option>
      </select>

      <select id="openaiVoiceSelect" style="width:100%; display:none;">
        <option value="onyx">Giọng Onyx (Nam trầm, uy lực)</option>
        <option value="echo">Giọng Echo (Nam khỏe khoắn)</option>
      </select>
      <div style="color:#888; font-size:0.74rem; margin-top:6px;">
        *App tự động lưu câu đã đọc vào bộ nhớ đệm nên không tốn thêm dung lượng API khi lặp lại câu!
      </div>
    </div>

    <select id="modeSelect">
      <option value="auto" selected>Tự động chạy 4 Hiệp (3p tập / 1p nghỉ)</option>
      <option value="1">Hiệp 1: Phản xạ & Bộ pháp</option>
      <option value="2">Hiệp 2: Tổ hợp Đấm + Đá</option>
      <option value="3">Hiệp 3: Chỏ, Gối & Phản công</option>
    </select>

    <div class="btn-row">
      <button class="btn-test" onclick="testVoice()">THỬ GIỌNG</button>
      <button class="btn-start" id="startBtn" onclick="startSession()">BẮT ĐẦU</button>
      <button class="btn-stop" onclick="stopSession()">DỪNG</button>
    </div>
  </div>

  <script>
    const combos = {
      1: [
        { id: "1_1", text: "Một!", hits: 1 },
        { id: "1_2", text: "Một Hai!", hits: 2 },
        { id: "1_3", text: "Đạp phải!", hits: 1 },
        { id: "1_4", text: "Nhấc chân đỡ!", hits: 1 },
        { id: "1_5", text: "Một Hai Ba!", hits: 3 },
        { id: "1_6", text: "Bước phải, đấm Hai!", hits: 1 },
        { id: "1_7", text: "Lùi bước, Một Hai!", hits: 2 },
        { id: "1_8", text: "Hai bụng, Ba mặt!", hits: 2 },
        { id: "1_9", text: "Lách đầu, Hai Ba!", hits: 2 }
      ],
      2: [
        { id: "2_1", text: "Một Hai, Đá trái!", hits: 3 },
        { id: "2_2", text: "Một Hai, Hai cái đá trái!", hits: 4 },
        { id: "2_3", text: "Một Hai Ba, Phá đùi trái!", hits: 4 },
        { id: "2_4", text: "Hai Ba, Đá sườn trái!", hits: 3 },
        { id: "2_5", text: "Một, Phá đùi phải!", hits: 2 },
        { id: "2_6", text: "Một Hai, Đổi chân đá phải!", hits: 3 },
        { id: "2_7", text: "Đạp phải! Bước tới Hai, Đá trái!", hits: 3 },
        { id: "2_8", text: "Nhá đạp! Hai Ba, Đá trái!", hits: 3 },
        { id: "2_9", text: "Một Sáu Ba, Phá đùi trái!", hits: 4 }
      ],
      3: [
        { id: "3_1", text: "Một Hai, Chỏ phải!", hits: 3 },
        { id: "3_2", text: "Một Hai, Chỏ phải, Gối trái!", hits: 4 },
        { id: "3_3", text: "Một Sáu Ba, Gối trái!", hits: 4 },
        { id: "3_4", text: "Đạp phải! Bước vào Hai, Chỏ phải!", hits: 3 },
        { id: "3_5", text: "Ôm gáy, Hai cái gối trái!", hits: 2 },
        { id: "3_6", text: "Đỡ chân! Hai Ba, Đá trái!", hits: 3 },
        { id: "3_7", text: "Đỡ chân! Hai, Chỏ phải, Gối trái!", hits: 3 }
      ]
    };
    combos[4] = [...combos[1], ...combos[2], ...combos[3]];

    const audioCache = {};
    let audioCtx = null;

    // Tự động lưu Key vào trình duyệt để lần sau mở không phải dán lại
    window.onload = () => {
      const savedKey = localStorage.getItem('muaythai_api_key');
      if (savedKey) document.getElementById('apiKeyInput').value = savedKey;
    };
    function saveKey() {
      localStorage.setItem('muaythai_api_key', document.getElementById('apiKeyInput').value.trim());
    }

    function switchEngine() {
      const eng = document.getElementById('engineSelect').value;
      document.getElementById('apiPanel').style.display = eng === 'browser' ? 'none' : 'block';
      document.getElementById('elevenVoiceSelect').style.display = eng === 'elevenlabs' ? 'block' : 'none';
      document.getElementById('openaiVoiceSelect').style.display = eng === 'openai' ? 'block' : 'none';
    }

    function playPadHits(count, callback) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const interval = 310;
      for (let i = 0; i < count; i++) {
        setTimeout(() => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          const isHeavy = (i === count - 1 && count >= 3);
          osc.frequency.setValueAtTime(isHeavy ? 130 : 185, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(35, audioCtx.currentTime + 0.12);
          gain.gain.setValueAtTime(isHeavy ? 0.95 : 0.7, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.12);
        }, 220 + i * interval);
      }
      setTimeout(() => { if (callback) callback(); }, 220 + count * interval);
    }

    async function speakCombo(item, callback) {
      const eng = document.getElementById('engineSelect').value;
      const key = document.getElementById('apiKeyInput').value.trim();
      saveKey();

      // 1. ELEVENLABS AI (Model Multilingual v2 hỗ trợ Tiếng Việt cực chuẩn)
      if (eng === 'elevenlabs' && key) {
        const voiceId = document.getElementById('elevenVoiceSelect').value;
        const cacheKey = "11labs_" + voiceId + "_" + item.id;

        if (audioCache[cacheKey]) {
          const audio = new Audio(audioCache[cacheKey]);
          audio.onended = () => { if (callback) callback(); };
          audio.play();
          return;
        }

        try {
          document.getElementById('comboCount').textContent = "Đang tải giọng ElevenLabs AI...";
          const res = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voiceId}`, {
            method: "POST",
            headers: {
              "xi-api-key": key,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              text: item.text,
              model_id: "eleven_flash_v2_5",
              voice_settings: { stability: 0.45, similarity_boost: 0.8 }
            })
          });
          if (res.ok) {
            const blob = await res.blob();
            const url = URL.createObjectURL(blob);
            audioCache[cacheKey] = url;
            document.getElementById('comboCount').textContent = "Đang phát giọng ElevenLabs AI!";
            const audio = new Audio(url);
            audio.onended = () => { if (callback) callback(); };
            audio.play();
            return;
          } else {
            document.getElementById('comboCount').textContent = "⚠️ Lỗi API Key ElevenLabs (Đang dùng giọng dự phòng)";
          }
        } catch (e) {}
      }

      // 2. OPENAI TTS
      if (eng === 'openai' && key) {
        const voice = document.getElementById('openaiVoiceSelect').value;
        const cacheKey = "openai_" + voice + "_" + item.id;

        if (audioCache[cacheKey]) {
          const audio = new Audio(audioCache[cacheKey]);
          audio.onended = () => { if (callback) callback(); };
          audio.play();
          return;
        }

        try {
          document.getElementById('comboCount').textContent = "Đang tải giọng OpenAI...";
          const res = await fetch("https://api.openai.com/v1/audio/speech", {
            method: "POST",
            headers: {
              "Authorization": "Bearer " + key,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              model: "tts-1",
              voice: voice,
              input: item.text,
              speed: 1.15
            })
          });
          if (res.ok) {
            const blob = await res.blob();
            const url = URL.createObjectURL(blob);
            audioCache[cacheKey] = url;
            document.getElementById('comboCount').textContent = "Đang phát giọng OpenAI Studio!";
            const audio = new Audio(url);
            audio.onended = () => { if (callback) callback(); };
            audio.play();
            return;
          } else {
            document.getElementById('comboCount').textContent = "⚠️ Lỗi API Key OpenAI (Kiểm tra lại số dư $5)";
          }
        } catch (e) {}
      }

      // 3. Dự phòng trình duyệt
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(item.text);
      utter.lang = 'vi-VN';
      utter.pitch = 0.85;
      utter.rate = 1.22;
      utter.onend = () => { if (callback) callback(); };
      utter.onerror = () => { if (callback) callback(); };
      window.speechSynthesis.speak(utter);
    }

    function testVoice() {
      const sample = combos[2][2];
      document.getElementById('comboDisplay').textContent = sample.text;
      speakCombo(sample, () => playPadHits(sample.hits));
    }

    // Vòng lặp chạy 4 hiệp tự động
    let timeLeft = 180, currentRound = 1, phase = "WORK", isRunning = false, timerInterval = null, comboTimeout = null;

    function startSession() {
      if (isRunning) return;
      isRunning = true;
      currentRound = 1;
      phase = "WORK";
      timeLeft = 180;
      document.getElementById('startBtn').textContent = "ĐANG TẬP...";
      nextLoop();
      timerInterval = setInterval(() => {
        timeLeft--;
        const m = String(Math.floor(timeLeft / 60)).padStart(2, '0');
        const s = String(timeLeft % 60).padStart(2, '0');
        document.getElementById('timer').textContent = `${m}:${s}`;

        if (timeLeft <= 0) {
          const isAuto = document.getElementById('modeSelect').value === 'auto';
          if (phase === "WORK" && isAuto && currentRound < 4) {
            phase = "REST";
            timeLeft = 60;
            clearTimeout(comboTimeout);
            document.getElementById('statusBadge').textContent = `NGHỈ GIẢI LAO 1 PHÚT`;
            document.getElementById('comboDisplay').textContent = "Hít thở sâu! Chuẩn bị hiệp sau!";
          } else if (phase === "REST") {
            currentRound++;
            phase = "WORK";
            timeLeft = 180;
            document.getElementById('statusBadge').textContent = `ĐANG TẬP HIỆP ${currentRound} / 4`;
            nextLoop();
          } else {
            stopSession();
            document.getElementById('comboDisplay').textContent = "HOÀN THÀNH BUỔI TẬP!";
          }
        }
      }, 1000);
    }

    function nextLoop() {
      if (!isRunning || phase !== "WORK") return;
      const mode = document.getElementById('modeSelect').value;
      const list = mode === 'auto' ? combos[currentRound] : combos[parseInt(mode)];
      const item = list[Math.floor(Math.random() * list.length)];
      document.getElementById('comboDisplay').textContent = item.text;
      speakCombo(item, () => {
        if (!isRunning || phase !== "WORK") return;
        playPadHits(item.hits, () => {
          comboTimeout = setTimeout(nextLoop, 2200);
        });
      });
    }

    function stopSession() {
      isRunning = false;
      clearInterval(timerInterval);
      clearTimeout(comboTimeout);
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      document.getElementById('startBtn').textContent = "BẮT ĐẦU";
      document.getElementById('comboDisplay').textContent = "Đã dừng!";
    }
  </script>
</body>
</html>
