<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HLV Muay Thái - Southpaw</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      text-align: center;
      padding: 15px;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 95vh;
      user-select: none;
    }
    .status-badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 0.9rem;
      margin: 0 auto 8px auto;
      text-transform: uppercase;
      background: rgba(0, 230, 118, 0.2);
      color: #00e676;
      border: 1px solid #00e676;
    }
    .timer {
      font-size: 4.5rem;
      font-weight: 900;
      margin: 0;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
      line-height: 1.05;
    }
    .combo-box {
      background: #1e1e1e;
      border: 3px solid #ff3b30;
      border-radius: 16px;
      padding: 20px 15px;
      margin: 12px 0;
      min-height: 110px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 1.7rem;
      font-weight: 800;
      color: #ffd60a;
      box-shadow: 0 6px 20px rgba(255,59,48,0.2);
    }
    .counter-tag {
      font-size: 0.82rem;
      color: #999;
      margin-top: 8px;
      font-weight: normal;
    }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 440px;
      margin: 0 auto;
      width: 100%;
    }
    select, button {
      padding: 14px;
      font-size: 1.05rem;
      border-radius: 12px;
      border: none;
      font-weight: bold;
    }
    select { background: #2c2c2e; color: #fff; text-align: center; }
    .btn-row { display: flex; gap: 10px; }
    button { flex: 1; cursor: pointer; }
    .btn-start { background: #ff3b30; color: white; font-size: 1.2rem; }
    .btn-stop { background: #3a3a3c; color: white; }
    .slider-box {
      background: #1e1e1e;
      padding: 10px 15px;
      border-radius: 12px;
      text-align: left;
      font-size: 0.9rem;
      color: #ddd;
    }
  </style>
</head>
<body>

  <div id="statusBadge" class="status-badge">SẴN SÀNG TẬP LUYỆN</div>
  <h1 id="roundTitle" style="font-size:1.3rem; margin:0 0 6px 0;">HLV MUAY THÁI (SOUTHPAW)</h1>

  <div class="timer" id="timer">00:10</div>

  <div class="combo-box" id="comboBox">
    <div id="comboDisplay">Bấm "BẮT ĐẦU" để có 10 giây xỏ găng!</div>
    <div class="counter-tag" id="comboCount">Nghỉ giữa lệnh: 1.5 giây</div>
  </div>

  <div class="controls">
    <select id="modeSelect">
      <option value="auto" selected>🔥 Tự động chạy Hiệp 1 ➔ Hiệp 4</option>
      <option value="1">Hiệp 1: Phản xạ & Bộ pháp</option>
      <option value="2">Hiệp 2: Tổ hợp Đấm + Đá</option>
      <option value="3">Hiệp 3: Chỏ, Gối & Phản công</option>
    </select>

    <div class="slider-box">
      <label>Nghỉ giữa 2 lệnh: <strong id="pauseVal" style="color:#00e676;">1.5</strong> giây</label>
      <input type="range" id="pauseRange" min="1.0" max="3.5" step="0.5" value="1.5" style="width:100%; margin-top:6px;">
    </div>

    <div class="btn-row">
      <button class="btn-start" id="startBtn" onclick="startSession()">BẮT ĐẦU</button>
      <button class="btn-stop" onclick="stopSession()">DỪNG</button>
    </div>
  </div>

  <script>
    const roundNames = {
      1: "Hiệp 1: Phản xạ & Bộ pháp",
      2: "Hiệp 2: Tổ hợp Đấm + Đá",
      3: "Hiệp 3: Chỏ, Gối & Phản công",
      4: "Hiệp 4: Thực chiến tổng hợp"
    };

    const combos = {
      1: [
        { text: "Một!", hits: 1 },
        { text: "Một, Một!", hits: 2 },
        { text: "Một Hai!", hits: 2 },
        { text: "Đạp phải!", hits: 1 },
        { text: "Đạp trái!", hits: 1 },
        { text: "Nhấc chân đỡ!", hits: 1 },
        { text: "Một Hai Ba!", hits: 3 },
        { text: "Hai Ba Hai!", hits: 3 },
        { text: "Lùi bước, Một Hai!", hits: 2 },
        { text: "Lách đầu sang phải, đấm Hai!", hits: 2 }
      ],
      2: [
        { text: "Một Hai, Đá trái!", hits: 3 },
        { text: "Một Hai, Hai cái đá trái!", hits: 4 },
        { text: "Một Hai Ba, Phá đùi trái!", hits: 4 },
        { text: "Hai Ba, Đá sườn trái!", hits: 3 },
        { text: "Một, Phá đùi phải!", hits: 2 },
        { text: "Một Hai, Đổi chân đá phải!", hits: 3 },
        { text: "Đạp phải! Bước tới Hai, Đá trái!", hits: 3 },
        { text: "Nhá đạp! Hai Ba, Đá trái!", hits: 3 },
        { text: "Một Sáu Ba, Phá đùi trái!", hits: 4 }
      ],
      3: [
        { text: "Một Hai, Chỏ phải!", hits: 3 },
        { text: "Một Hai, Chỏ phải, Gối trái!", hits: 4 },
        { text: "Một Sáu Ba, Gối trái!", hits: 4 },
        { text: "Đạp phải! Bước vào Hai, Chỏ phải!", hits: 3 },
        { text: "Ôm gáy, Hai cái gối trái!", hits: 2 },
        { text: "Đỡ chân! Hai Ba, Đá trái!", hits: 3 },
        { text: "Lách đầu sang phải, Hai Ba, Gối trái!", hits: 3 }
      ]
    };
    combos[4] = [...combos[1], ...combos[2], ...combos[3]];

    const WORK_TIME = 180;
    const REST_TIME = 60;
    const PREP_TIME = 10;

    let currentRound = 1;
    let phase = "IDLE"; // IDLE, PREP, WORK, REST
    let timeLeft = PREP_TIME;
    let deck = [];
    let countDone = 0;

    let timerInterval = null;
    let comboTimeout = null;
    let isRunning = false;
    let audioCtx = null;

    document.getElementById('pauseRange').oninput = (e) => document.getElementById('pauseVal').textContent = e.target.value;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playPadHits(count, callback) {
      initAudio();
      const interval = 260;
      for (let i = 0; i < count; i++) {
        setTimeout(() => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          const isHeavy = (i === count - 1 && count >= 3);
          osc.frequency.setValueAtTime(isHeavy ? 130 : 185, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(35, audioCtx.currentTime + 0.1);
          gain.gain.setValueAtTime(isHeavy ? 0.95 : 0.7, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.1);
        }, 180 + i * interval);
      }
      setTimeout(() => { if (callback) callback(); }, 180 + count * interval);
    }

    function speak(text, callback) {
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'vi-VN';
      utter.pitch = 0.95;
      utter.rate = 1.3;

      const voices = window.speechSynthesis.getVoices();
      const chosen = voices.find(v => v.lang.includes('vi'));
      if (chosen) utter.voice = chosen;

      utter.onend = () => { if (callback) callback(); };
      utter.onerror = () => { if (callback) callback(); };
      window.speechSynthesis.speak(utter);
    }

    function shuffleDeck(roundNum) {
      deck = [...combos[roundNum]];
      for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
      }
    }

    function updateTimerDisplay() {
      const m = String(Math.floor(timeLeft / 60)).padStart(2, '0');
      const s = String(timeLeft % 60).padStart(2, '0');
      document.getElementById('timer').textContent = `${m}:${s}`;
    }

    function startSession() {
      if (isRunning) return;
      initAudio();
      isRunning = true;
      currentRound = 1;
      phase = "PREP";
      timeLeft = PREP_TIME;
      
      document.getElementById('startBtn').textContent = "ĐANG CHUẨN BỊ...";
      document.getElementById('statusBadge').textContent = "CHUẨN BỊ XỎ GĂNG";
      document.getElementById('roundTitle').textContent = roundNames[currentRound];
      
      updateTimerDisplay();
      speak("Chuẩn bị xỏ găng, mười giây nữa bắt đầu!", () => {
        timerInterval = setInterval(tick, 1000);
      });
    }

    function tick() {
      if (!isRunning) return;
      timeLeft--;
      updateTimerDisplay();

      if (timeLeft <= 0) {
        if (phase === "PREP") {
          phase = "WORK";
          timeLeft = WORK_TIME;
          countDone = 0;
          shuffleDeck(currentRound);
          document.getElementById('statusBadge').textContent = `HIỆP ${currentRound} / 4`;
          speak(`Hiệp một, bắt đầu!`, () => {
            nextLoop();
          });
        } else if (phase === "WORK") {
          const isAuto = document.getElementById('modeSelect').value === 'auto';
          if (isAuto && currentRound < 4) {
            phase = "REST";
            timeLeft = REST_TIME;
            clearTimeout(comboTimeout);
            document.getElementById('statusBadge').textContent = "NGHỈ 1 PHÚT";
            document.getElementById('comboDisplay').textContent = "Hít thở sâu! Nghỉ giải lao!";
            speak("Hết hiệp! Nghỉ một phút, hít thở sâu!");
          } else {
            stopSession();
            document.getElementById('comboDisplay').textContent = "HOÀN THÀNH BUỔI TẬP!";
          }
        } else if (phase === "REST") {
          currentRound++;
          phase = "WORK";
          timeLeft = WORK_TIME;
          countDone = 0;
          shuffleDeck(currentRound);
          document.getElementById('statusBadge').textContent = `HIỆP ${currentRound} / 4`;
          document.getElementById('roundTitle').textContent = roundNames[currentRound];
          speak(`Chuẩn bị vào hiệp ${currentRound}!`, () => {
            nextLoop();
          });
        }
      }
    }

    function nextLoop() {
      if (!isRunning || phase !== "WORK") return;
      if (deck.length === 0) shuffleDeck(currentRound);

      const item = deck.pop();
      countDone++;

      document.getElementById('comboDisplay').textContent = item.text;
      document.getElementById('comboCount').textContent = `Hiệp ${currentRound} • Lệnh số ${countDone} (Còn ${deck.length} câu chưa lặp)`;

      speak(item.text, () => {
        if (!isRunning || phase !== "WORK") return;
        playPadHits(item.hits, () => {
          if (!isRunning || phase !== "WORK") return;
          const pauseMs = parseFloat(document.getElementById('pauseRange').value) * 1000;
          comboTimeout = setTimeout(nextLoop, pauseMs);
        });
      });
    }

    function stopSession() {
      isRunning = false;
      phase = "IDLE";
      clearInterval(timerInterval);
      clearTimeout(comboTimeout);
      window.speechSynthesis.cancel();
      document.getElementById('startBtn').textContent = "BẮT ĐẦU";
      document.getElementById('comboDisplay').textContent = "Đã dừng!";
      document.getElementById('statusBadge').textContent = "SẴN SÀNG TẬP LUYỆN";
      timeLeft = PREP_TIME;
      updateTimerDisplay();
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }
  </script>
</body>
</html>
